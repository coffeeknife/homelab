# Grants the external Traefik LXC (~/Dev/traefik) read access to watch
# Ingress/IngressRoute resources out-of-cluster, ahead of retiring the
# in-cluster Traefik HelmRelease. Not used by anything running in-cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-external
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: infrastructure
---
apiVersion: v1
kind: Secret
metadata:
  name: traefik-external-token
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: infrastructure
  annotations:
    kubernetes.io/service-account.name: traefik-external
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-external
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: infrastructure
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses/status"]
    verbs: ["update"]
  - apiGroups: ["traefik.io"]
    resources:
      - middlewares
      - middlewaretcps
      - ingressroutes
      - ingressroutetcps
      - ingressrouteudps
      - traefikservices
      - tlsoptions
      - tlsstores
      - serverstransports
      - serverstransporttcps
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-external
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: infrastructure
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-external
subjects:
  - kind: ServiceAccount
    name: traefik-external
    namespace: traefik
