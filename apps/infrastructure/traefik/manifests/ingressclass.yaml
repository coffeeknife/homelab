# Standalone IngressClass, decoupled from the (now removed) in-cluster
# Traefik HelmRelease. Every app's Ingress relies on this being the
# cluster-default (none of them set ingressClassName explicitly) — kept
# here so ingress-class resolution doesn't change now that the actual
# Traefik controller runs externally (~/Dev/traefik) instead of in-cluster.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: infrastructure
spec:
  controller: traefik.io/ingress-controller
