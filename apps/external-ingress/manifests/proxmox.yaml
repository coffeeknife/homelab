---
apiVersion: v1
kind: Service
metadata:
  name: pve
  namespace: external-ingress
  annotations:
    # Traefik `service.*` annotations belong on the Service, not the Ingress,
    # and the KubernetesCRD provider registers ServersTransports namespaced as
    # <namespace>-<name>@kubernetescrd. Get either wrong and the reference is
    # silently ignored: Traefik falls back to the default transport, which
    # rejects Proxmox's self-signed cert with a 500 (x509: unknown authority).
    traefik.ingress.kubernetes.io/service.serverstransport: external-ingress-pve-transport@kubernetescrd
spec:
  ports:
  # The `https-` port-name prefix is what makes Traefik speak TLS to the backend.
  - name: https-pve
    port: 8006
    protocol: TCP
    targetPort: 8006
  clusterIP: None
  type: ClusterIP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: pve
  namespace: external-ingress
subsets:
- addresses:
  - ip: 192.168.1.119
  ports:
  - name: https-pve
    port: 8006
    protocol: TCP
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: pve-transport
  namespace: external-ingress
spec:
  insecureSkipVerify: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pve
  namespace: external-ingress
  annotations:
    cert-manager.io/cluster-issuer: cert-issuer
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
        - pve.wrenspace.dev
      secretName: pve
  rules:
    - host: pve.wrenspace.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pve
                port:
                  number: 8006