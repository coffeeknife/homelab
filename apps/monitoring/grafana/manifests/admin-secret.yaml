# Grafana's local admin account.
#
# Replaces a hardcoded `adminPassword: changeme` in values.yaml. That default
# granted full Grafana admin over the HTTP API — `auth.disable_login_form: true`
# only hides the web login form, it does NOT disable Grafana's basic-auth API
# path, so `curl -u admin:changeme /api/user` returned isGrafanaAdmin: true and
# bypassed Authelia entirely.
#
# The password is generated in-cluster by the mittwald secret-generator, so no
# credential is committed. `admin-user` is a username, not a credential, and the
# chart requires both keys in the same Secret (admin.userKey/passwordKey), so it
# is set literally here.
#
# This account is deliberately kept as a break-glass path: if Authelia/OIDC is
# unavailable, flip `auth.disable_login_form` to false and read the generated
# password with:
#   kubectl get secret grafana-admin -n monitoring \
#     -o jsonpath='{.data.admin-password}' | base64 -d
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: monitoring
  annotations:
    secret-generator.v1.mittwald.de/autogenerate: admin-password
    secret-generator.v1.mittwald.de/length: "48"
    secret-generator.v1.mittwald.de/encoding: base64url
stringData:
  admin-user: admin
