prometheus:
  prometheusSpec:
    retention: 14d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 50Gi
    resources:
      requests:
        cpu: 50m
        memory: 2Gi
      limits:
        cpu: 500m
        memory: 4Gi
    ruleSelector: {}  

grafana:
  enabled: false

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
  config:
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      receiver: 'ntfy'
      routes:
        - matchers:
            - alertname = "Watchdog"
          receiver: 'null'
    receivers:
      - name: 'null'
      - name: 'ntfy'
        webhook_configs:
          - url: 'http://ntfy.notify.svc.cluster.local/alerts?template=alertmanager'
            send_resolved: true

defaultRules:
  create: true
  rules:
    kubernetesApps: true

# k3s embeds these in one binary, so they have no pods or endpoints to scrape.
# Left enabled, they fire permanent false KubeSchedulerDown-style critical alerts.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

prometheus-node-exporter:
  enabled: true

kubeStateMetrics:
  enabled: true