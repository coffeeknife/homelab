apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: homelab-digest
  namespace: flux-system
spec:
  interval: 10m
  sourceRef:
    kind: GitRepository
    name: homelab
  path: ./apps/monitoring/homelab-digest/manifests
  prune: true
  wait: true
  dependsOn:
    - name: ollama
