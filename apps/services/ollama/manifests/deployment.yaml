apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/part-of: services
spec:
  # Scaled to 0 on 2026-08-10. This pod cannot run on the current node: the
  # image, OLLAMA_VULKAN and the /dev/kfd mount below all target the AMD
  # RX560 (Polaris/gfx803) that was retired with etheirys 2026-07-18. kube-vm
  # now has an Intel HD630, which has no /dev/kfd. Before scaling back up,
  # replace the image and drop the AMD-specific bits — flipping the
  # `gpu` nodeSelector alone is not enough.
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
        app.kubernetes.io/name: ollama
    spec:
      nodeSelector:
        gpu: amd
      securityContext:
        supplementalGroups:
          - 44   # video
          - 110  # render
      containers:
        - name: ollama
          # Community Vulkan-enabled ollama build (github.com/grinco/ollama-vulkan).
          # Polaris/gfx803 is unsupported by upstream ROCm builds, so we use
          # this fork to drive the GPU via Mesa RADV instead.
          image: grinco/ollama-amd-apu:vulkan
          securityContext:
            privileged: true
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_MODELS
              value: /root/.ollama/models
            - name: OLLAMA_KEEP_ALIVE
              value: "30m"
            # Polaris (gfx803) is unsupported by current ROCm builds, so we
            # use the Vulkan backend (Mesa RADV) instead. The ollama:rocm
            # image bundles libvulkan + radeon_icd.json out of the box.
            - name: OLLAMA_VULKAN
              value: "true"
          ports:
            - name: http
              containerPort: 11434
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
            - name: dri
              mountPath: /dev/dri
            - name: kfd
              mountPath: /dev/kfd
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ollama-models
        - name: dri
          hostPath:
            path: /dev/dri
        - name: kfd
          hostPath:
            path: /dev/kfd
