# Public exposure for i.wrenspace.dev via the shared cloudflared ClusterTunnel.
# Activated 2026-08-23, after the first-run setup wizard was completed over the
# LAN — Zipline ships with no default account and hands the super-admin slot to
# whoever reaches /auth/setup first, so it must not be public before then.
# cloudflared hits the Service directly; this path does not traverse Traefik.
apiVersion: networking.cfargotunnel.com/v1alpha1
kind: TunnelBinding
metadata:
  name: zipline-binding
  namespace: zipline
subjects:
  - kind: Service # Default
    name: zipline
    spec:
      fqdn: i.wrenspace.dev
      protocol: https
      target: http://zipline.zipline.svc.cluster.local:3000
tunnelRef:
  kind: ClusterTunnel # Or ClusterTunnel
  name: cluster-tunnel
  disableDNSUpdates: false
