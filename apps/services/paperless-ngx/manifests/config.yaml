apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-config
  namespace: paperless
data:
  PAPERLESS_URL: "https://file.wrenspace.dev"
  PAPERLESS_CSRF_TRUSTED_ORIGINS: "https://*.wrenspace.dev/"
  PAPERLESS_CORS_ALLOWED_HOSTS: "https://file.wrenspace.dev"
  PAPERLESS_PORT: "8000"
  PAPERLESS_TIME_ZONE: America/Chicago
  # file processing
  PAPERLESS_CONSUMER_ENABLE_BARCODES: "true"
  PAPERLESS_CONSUMER_ENABLE_ASN_BARCODE: "true"
  # v3 stops rejecting duplicates by default; keep the v2 behaviour
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
  # v3 default is "auto" (no archive for born-digital PDFs); v2 always archived
  PAPERLESS_ARCHIVE_FILE_GENERATION: "always"
  # container sees the node's 4 CPUs despite the 1-CPU limit, so the default
  # OCR fan-out OOM-killed the consume worker at the memory limit (WorkerLostError
  # SIGKILL); serialize it
  PAPERLESS_TASK_WORKERS: "1"
  PAPERLESS_THREADS_PER_WORKER: "1"
  # db
  PAPERLESS_DBHOST: mariadb-port.mariadb-sys.svc.cluster.local
  PAPERLESS_DBENGINE: mariadb
  PAPERLESS_DBPORT: "3306"
  PAPERLESS_DBNAME: paperless-db
  PAPERLESS_DBUSER: paperless
  PAPERLESS_DB_READ_CACHE_ENABLED: "true"
  # branding
  PAPERLESS_APP_TITLE: Yaoi Records
  # SSO
  PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
  PAPERLESS_SOCIAL_AUTO_SIGNUP: "true"
  PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "true"
  PAPERLESS_DISABLE_REGULAR_LOGIN: "false"
  PAPERLESS_REDIRECT_LOGIN_TO_SSO: "false"
  PAPERLESS_ACCOUNT_SESSION_REMEMBER: "true"
  # email sending
  PAPERLESS_EMAIL_HOST: send.smtp-relay.svc.cluster.local
  PAPERLESS_EMAIL_FROM: Paperless <admin@wrenspace.dev>
  # consume
  PAPERLESS_CONSUMPTION_DIR: ../consume/
  # inotify mode (no PAPERLESS_CONSUMER_POLLING*): consume dir is a local-path
  # PVC on the node, so kernel watches see vsftpd's writes. v3 replaces the
  # watcher with watchfiles; CONSUMER_STABILITY_DELAY (5s) covers partial writes.